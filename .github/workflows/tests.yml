name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # Both, and not just for completeness: ccbot drives tmux and reads host
    # state, and every Linux-only assumption in that layer (/proc, systemd,
    # `free`, GNU flag spellings) is invisible until a macOS runner executes
    # it. A Linux-only matrix is what let a version-symlinked claude get its
    # windows reaped, the nested-claude guard sit silently disabled and the
    # /status disk bar read the wrong volume — all on released code.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Type check
        run: uv run pyright src/ccbot/

      - name: Tests
        run: uv run pytest tests/ -q
